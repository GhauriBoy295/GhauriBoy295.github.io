<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#04090E">
  <meta name="robots" content="noindex">
  <title>Route not found | Sarmad Saeed</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    /* Standalone page: tokens are inlined literals matching the BlackICE
       Night and Forensic Daylight palettes in assets/css/tokens.css. Keep
       both in step when retheming. */
    :root {
      color-scheme: dark light;
      --canvas: #020507;
      --surface-1: #06111D;
      --surface-2: #081827;
      --border: #1B405A;
      --secure: #22E58B;
      --secure-ink: #012014;
      --text-1: #F5F8FA;
      --text-2: #C6D2DC;
      --text-3: #91A6B7;
      --grid: rgba(27, 64, 90, .5);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --canvas: #EDF2F6;
        --surface-1: #FFFFFF;
        --surface-2: #F6F9FB;
        --border: #B6C6D3;
        --secure: #0A6E45;
        --secure-ink: #FFFFFF;
        --text-1: #08151F;
        --text-2: #2C4356;
        --text-3: #4C6376;
        --grid: rgba(143, 166, 183, .32);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--canvas);
      color: var(--text-2);
      line-height: 1.65;
    }

    .grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 64px 64px;
      opacity: .28;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 78%);
    }

    main {
      width: min(640px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface-1);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: .72rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--secure);
    }

    .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--secure); }

    h1 {
      margin: 20px 0 0;
      font-size: clamp(2.25rem, 9vw, 3.75rem);
      line-height: 1.05;
      letter-spacing: -.04em;
      color: var(--text-1);
    }

    p { max-width: 52ch; margin: 18px 0 0; }

    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      padding: 13px 20px;
      border-radius: 12px;
      background: var(--secure);
      color: var(--secure-ink);
      font-weight: 650;
      font-size: .9rem;
      text-decoration: none;
    }

    a:focus-visible { outline: 2px solid var(--secure); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <main>
    <span class="status"><i aria-hidden="true"></i>System response · 404</span>
    <h1>Route not found.</h1>
    <p>The requested path is not part of this portfolio. Return to the main site to continue through Sarmad Saeed’s cyber security work — missions, capabilities, credentials and availability.</p>
    <a href="./">Return to portfolio</a>
  </main>
</body>
</html>
