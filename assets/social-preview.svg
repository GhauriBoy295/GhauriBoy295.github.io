<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.5" stop-color="#020405"/>
      <stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.1" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#00e676" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#72ffb0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#72ffb0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
