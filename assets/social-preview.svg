    </pattern>
    <linearGradient id="shield" x1="120" y1="190" x2="272" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e676"/>
      <stop offset="1" stop-color="#72ffb0"/>
