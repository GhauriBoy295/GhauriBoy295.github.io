<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- AEGIS NEXUS social preview, 1200x630. BlackICE Night palette: navy and
       black structure, solid green as the signal colour, no red (nothing here
       is an incident state). Original artwork; no external assets. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1B405A" stroke-opacity="0.55" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#020507"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- Panel -->
  <rect x="40" y="36" width="1120" height="558" rx="24" fill="#06111D" stroke="#1B405A" stroke-width="1.5"/>

  <!-- Window bar -->
  <path d="M40 96 H1160" stroke="#102B3F" stroke-width="1.5"/>
  <circle cx="72" cy="66" r="5.5" fill="#24567A"/>
  <circle cx="90" cy="66" r="5.5" fill="#24567A"/>
  <circle cx="108" cy="66" r="5.5" fill="#22E58B"/>
  <text x="132" y="71" fill="#91A6B7" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" letter-spacing="2.4">AEGIS NEXUS · SECURE PROFILE</text>
  <circle cx="1046" cy="66" r="4.5" fill="#22E58B"/>
  <text x="1060" y="71" fill="#22E58B" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" letter-spacing="2.2">READY</text>

  <!-- Availability pill -->
  <rect x="80" y="136" width="470" height="38" rx="19" fill="#0C2B22" stroke="#22E58B" stroke-opacity="0.45" stroke-width="1.4"/>
  <circle cx="104" cy="155" r="6" fill="#22E58B"/>
  <text x="120" y="161" fill="#22E58B" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600">Open to cyber security opportunities worldwide</text>

  <!-- Name -->
  <text x="78" y="262" fill="#F5F8FA" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-3">SARMAD <tspan fill="#22E58B">SAEED</tspan></text>

  <text x="80" y="312" fill="#F5F8FA" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="650">MSc Cyber Security Graduate</text>
  <text x="80" y="350" fill="#91A6B7" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22">University of Chester · 2025–2026 · Graduated</text>

  <!-- Status cards -->
  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" letter-spacing="1.6">
    <rect x="80" y="392" width="228" height="88" rx="12" fill="#081827" stroke="#102B3F"/>
    <rect x="80" y="392" width="2.5" height="88" fill="#22E58B"/>
    <text x="102" y="424" fill="#91A6B7">CURRENT BASE</text>
    <text x="102" y="456" fill="#F5F8FA" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" letter-spacing="0">United Kingdom</text>

    <rect x="324" y="392" width="228" height="88" rx="12" fill="#081827" stroke="#102B3F"/>
    <rect x="324" y="392" width="2.5" height="88" fill="#22E58B"/>
    <text x="346" y="424" fill="#91A6B7">AVAILABILITY</text>
    <text x="346" y="456" fill="#22E58B" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" letter-spacing="0">Worldwide</text>
  </g>

  <!-- Focus tags -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="80" y="504" width="132" height="34" rx="8" fill="#081827" stroke="#1B405A"/>
    <text x="146" y="526" text-anchor="middle" fill="#C6D2DC">SOC OPERATIONS</text>
    <rect x="222" y="504" width="78" height="34" rx="8" fill="#081827" stroke="#1B405A"/>
    <text x="261" y="526" text-anchor="middle" fill="#C6D2DC">DFIR</text>
    <rect x="310" y="504" width="112" height="34" rx="8" fill="#081827" stroke="#1B405A"/>
    <text x="366" y="526" text-anchor="middle" fill="#C6D2DC">ICS / OT</text>
    <rect x="432" y="504" width="176" height="34" rx="8" fill="#081827" stroke="#1B405A"/>
    <text x="520" y="526" text-anchor="middle" fill="#C6D2DC">SECURITY RESEARCH</text>
  </g>

  <!-- Globe -->
  <g transform="translate(880 330)" stroke="#22E58B" fill="none">
    <circle r="168" stroke="#1B405A" stroke-width="1.5"/>
    <ellipse rx="112" ry="168" stroke="#1B405A" stroke-opacity="0.7"/>
    <ellipse rx="56" ry="168" stroke="#1B405A" stroke-opacity="0.7"/>
    <line x1="0" y1="-168" x2="0" y2="168" stroke="#1B405A" stroke-opacity="0.7"/>
    <path d="M-125 -112 Q0 -88 125 -112" stroke="#1B405A" stroke-opacity="0.7"/>
    <path d="M-158 -56 Q0 -28 158 -56" stroke="#1B405A" stroke-opacity="0.7"/>
    <path d="M-168 0 Q0 28 168 0" stroke="#1B405A" stroke-opacity="0.8"/>
    <path d="M-158 56 Q0 84 158 56" stroke="#1B405A" stroke-opacity="0.7"/>
    <path d="M-125 112 Q0 136 125 112" stroke="#1B405A" stroke-opacity="0.7"/>

    <g stroke-opacity="0.5" stroke-width="1.4">
      <path d="M-22 -72 Q-90 -34 -110 24"/>
      <path d="M-22 -72 Q56 -30 92 26"/>
      <path d="M-22 -72 Q-4 12 -44 92"/>
      <path d="M-22 -72 Q84 -6 66 104"/>
    </g>
    <g fill="#91A6B7" stroke="none">
      <circle cx="-110" cy="24" r="4"/>
      <circle cx="92" cy="26" r="4"/>
      <circle cx="-44" cy="92" r="4"/>
      <circle cx="66" cy="104" r="4"/>
      <circle cx="-62" cy="-40" r="3.4"/>
      <circle cx="48" cy="-88" r="3.4"/>
      <circle cx="6" cy="132" r="3.4"/>
    </g>
    <circle cx="-22" cy="-72" r="14" fill="#22E58B" fill-opacity="0.2" stroke="none"/>
    <circle cx="-22" cy="-72" r="7" fill="#22E58B" stroke="none"/>
  </g>

  <!-- Footer -->
  <text x="80" y="572" fill="#91A6B7" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" letter-spacing="1.4">ghauriboy295.github.io</text>
  <text x="1120" y="572" text-anchor="end" fill="#91A6B7" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" letter-spacing="1.4">REMOTE · HYBRID · ON-SITE · RELOCATION</text>
</svg>
