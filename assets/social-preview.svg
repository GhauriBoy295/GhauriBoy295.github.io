  <circle cx="196" cy="300" r="97" fill="none" stroke="#00e676" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="196" cy="182" r="5" fill="#00e676"/>
  <circle cx="93" cy="352" r="4.5" fill="#72ffb0"/>
  <circle cx="299" cy="348" r="4.5" fill="#00e676"/>
  <path d="M196 208 L268 236 v50c0 42-28 76-72 94-44-18-72-52-72-94v-50z"
