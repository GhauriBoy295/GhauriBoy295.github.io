 opacity="0.5"/><rect x="1560" y="324" width="54" height="72" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="1566" y="346" width="42" height="3" fill="#29F58C" opacity="0.72"/><rect x="1566" y="368" width="42" height="3" fill="#29F58C" opacity="0.3"/></g>
  <rect x="0" y="250" width="1584" height="146" fill="url(#lbDeckFade)"/>

  <rect width="1584" height="396" fill="url(#lbLeftShade)"/>

  <!-- Left identity rail -->
  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" letter-spacing="3.4">
    <circle cx="52" cy="52" r="4.5" fill="#29F58C"/>
    <text x="68" y="57" fill="#8FA8C0">AEGIS NEXUS &#183; SECURE PROFILE</text>
  </g>
  <path d="M52 78 V150" stroke="#1E4A7A" stroke-width="1.5"/>

  <!-- Globe -->
  <g transform="translate(1300 186)">
    <circle r="196" fill="url(#lbGlow)"/>
    <g fill="none" stroke="#2D6BA8">
      <circle r="148" stroke-opacity="0.85"/>
      <ellipse rx="99" ry="148" stroke-opacity="0.5"/>
      <ellipse rx="49" ry="148" stroke-opacity="0.5"/>
      <line x1="0" y1="-148" x2="0" y2="148" stroke-opacity="0.5"/>
      <path d="M-110 -99 Q0 -78 110 -99" stroke-opacity="0.5"/>
      <path d="M-140 -49 Q0 -25 140 -49" stroke-opacity="0.5"/>
      <path d="M-148 0 Q0 25 148 0" stroke-opacity="0.6"/>
      <path d="M-140 49 Q0 74 140 49" stroke-opacity="0.5"/>
      <path d="M-110 99 Q0 121 110 99" stroke-opacity="0.5"/>
    </g>

    <!-- Routes from the UK base node: base is UK, availability is worldwide -->
    <g fill="none" stroke="#29F58C" stroke-opacity="0.5" stroke-width="1.4">
      <path d="M-20 -64 Q-80 -30 -97 21"/>
      <path d="M-20 -64 Q50 -26 81 23"/>
      <path d="M-20 -64 Q-4 11 -39 81"/>
      <path d="M-20 -64 Q74 -6 58 92"/>
      <path d="M-20 -64 Q-96 -70 -128 -22"/>
    </g>
    <g fill="#8FA8C0">
      <circle cx="-97" cy="21" r="3.6"/><circle cx="81" cy="23" r="3.6"/>
      <circle cx="-39" cy="81" r="3.6"/><circle cx="58" cy="92" r="3.6"/>
      <circle cx="-128" cy="-22" r="3.2"/><circle cx="-55" cy="-35" r="3"/>
      <circle cx="42" cy="-78" r="3"/><circle cx="5" cy="117" r="3"/>
    </g>
    <circle cx="-20" cy="-64" r="13" fill="#29F58C" fill-opacity="0.22"/>
    <circle cx="-20" cy="-64" r="6.4" fill="#29F58C"/>

    <g fill="none" stroke="#29F58C" stroke-opacity="0.5" stroke-width="1.6">
      <path d="M-176 -140 V-176 H-140M176 -140 V-176 H140M-176 140 V176 H-140M176 140 V176 H140"/>
    </g>
  </g>

  <!-- Availability pill -->
  <rect x="430" y="86" width="452" height="36" rx="18" fill="#03231A" stroke="#29F58C" stroke-opacity="0.45" stroke-width="1.4"/>
  <circle cx="453" cy="104" r="5.5" fill="#29F58C"/>
  <text x="469" y="110" fill="#29F58C" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Open to cyber security opportunities worldwide</text>

  <!-- Name -->
  <text x="428" y="196" fill="#F2F7FB" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2.2">SARMAD <tspan fill="#29F58C">SAEED</tspan></text>

