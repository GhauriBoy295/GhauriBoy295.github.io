<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <!-- LinkedIn banner, 1584x396. Matches the deployed portfolio at release
       25.0.0: BlackICE Night palette, navy structure, green as a signal only,
       and the same Operations Deck motif used above the site's hero.

       Layout is dictated by LinkedIn's own chrome. The profile photo overlaps
       the lower-left on desktop and mobile crops the sides, so nothing that has
       to be read sits below y=230 in the left third or within 90px of either
       edge. Original artwork; no external assets. -->
  <defs>
    <pattern id="lbGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1E4A7A" stroke-opacity="0.5" stroke-width="1"/>
    </pattern>
    <radialGradient id="lbFade" cx="0.72" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="lbGridMask"><rect width="1584" height="396" fill="url(#lbFade)"/></mask>
    <radialGradient id="lbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#29F58C" stop-opacity="0.24"/>
      <stop offset="0.42" stop-color="#29F58C" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#29F58C" stop-opacity="0"/>
    </radialGradient>
    <!-- The left third carries the profile photo, so it drops to solid black.
         It also stops the grid competing with the avatar's edge. -->
    <linearGradient id="lbLeftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="1"/>
      <stop offset="0.16" stop-color="#000000" stop-opacity="0.94"/>
      <stop offset="0.32" stop-color="#000000" stop-opacity="0.62"/>
      <stop offset="0.46" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <!-- Racks fade into the ground rather than ending on a hard line. -->
    <linearGradient id="lbDeckFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000306" stop-opacity="0"/>
      <stop offset="1" stop-color="#000306" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="#000306"/>
  <rect width="1584" height="396" fill="url(#lbGrid)" mask="url(#lbGridMask)"/>

  <!-- Operations deck -->
  <g opacity="0.85"><rect x="430" y="276" width="54" height="120" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="436" y="298" width="42" height="3" fill="#29F58C" opacity="0.72"/><rect x="436" y="320" width="42" height="3" fill="#29F58C" opacity="0.3"/><rect x="436" y="342" width="42" height="3" fill="#29F58C" opacity="0.3"/><rect x="436" y="364" width="42" height="3" fill="#29F58C" opacity="0.72"/><rect x="506" y="342" width="34" height="54" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="512" y="364" width="22" height="3" fill="#29F58C" opacity="0.72"/><rect x="556" y="342" width="34" height="54" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="562" y="364" width="22" height="3" fill="#29F58C" opacity="0.18"/><rect x="612" y="276" width="54" height="120" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="618" y="298" width="42" height="3" fill="#29F58C" opacity="0.3"/><rect x="618" y="320" width="42" height="3" fill="#29F58C" opacity="0.18"/><rect x="618" y="342" width="42" height="3" fill="#29F58C" opacity="0.18"/><rect x="618" y="364" width="42" height="3" fill="#29F58C" opacity="0.18"/><rect x="676" y="324" width="34" height="72" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="682" y="346" width="22" height="3" fill="#29F58C" opacity="0.18"/><rect x="682" y="368" width="22" height="3" fill="#29F58C" opacity="0.72"/><rect x="726" y="324" width="54" height="72" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="732" y="346" width="42" height="3" fill="#29F58C" opacity="0.3"/><rect x="732" y="368" width="42" height="3" fill="#29F58C" opacity="0.5"/><rect x="796" y="342" width="26" height="54" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="802" y="364" width="14" height="3" fill="#29F58C" opacity="0.72"/><rect x="844" y="276" width="44" height="120" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="850" y="298" width="32" height="3" fill="#29F58C" opacity="0.18"/><rect x="850" y="320" width="32" height="3" fill="#29F58C" opacity="0.5"/><rect x="850" y="342" width="32" height="3" fill="#29F58C" opacity="0.5"/><rect x="850" y="364" width="32" height="3" fill="#29F58C" opacity="0.3"/><rect x="910" y="342" width="44" height="54" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="916" y="364" width="32" height="3" fill="#29F58C" opacity="0.18"/><rect x="976" y="276" width="26" height="120" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="982" y="298" width="14" height="3" fill="#29F58C" opacity="0.18"/><rect x="982" y="320" width="14" height="3" fill="#29F58C" opacity="0.5"/><rect x="982" y="342" width="14" height="3" fill="#29F58C" opacity="0.72"/><rect x="982" y="364" width="14" height="3" fill="#29F58C" opacity="0.18"/><rect x="1012" y="324" width="26" height="72" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="1018" y="346" width="14" height="3" fill="#29F58C" opacity="0.3"/><rect x="1018" y="368" width="14" height="3" fill="#29F58C" opacity="0.18"/><rect x="1054" y="276" width="54" height="120" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="1060" y="298" width="42" height="3" fill="#29F58C" opacity="0.72"/><rect x="1060" y="320" width="42" height="3" fill="#29F58C" opacity="0.18"/><rect x="1060" y="342" width="42" height="3" fill="#29F58C" opacity="0.3"/><rect x="1060" y="364" width="42" height="3" fill="#29F58C" opacity="0.5"/><rect x="1124" y="300" width="26" height="96" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="1130" y="322" width="14" height="3" fill="#29F58C" opacity="0.5"/><rect x="1130" y="344" width="14" height="3" fill="#29F58C" opacity="0.18"/><rect x="1130" y="366" width="14" height="3" fill="#29F58C" opacity="0.72"/><rect x="1160" y="324" width="34" height="72" fill="#061426" stroke="#10304F" stroke-width="1"/><rect x="1166" y="346" width="22" height="3" fill="#29F58C" opacity="0.18"/><rect x="1166" y="368" width="22" height="3" fill="#29F58C" opacity="0.18"/><rect x="1204" y="