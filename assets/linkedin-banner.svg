<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396">
  <!-- LinkedIn banner, 1584x396. Same design system as the portfolio:
       BlackICE Night palette, navy structure, green as a signal only.

       Layout is dictated by LinkedIn's own chrome. The profile photo overlaps
       the lower-left of the banner on desktop, and mobile crops the sides, so
       nothing that has to be read is placed below y=230 on the left third or
       within 90px of either edge. Original artwork; no external assets. -->
  <defs>
    <pattern id="lbGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1B405A" stroke-opacity="0.5" stroke-width="1"/>
    </pattern>
    <radialGradient id="lbFade" cx="0.72" cy="0.5" r="0.65">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="lbGridMask">
      <rect width="1584" height="396" fill="url(#lbFade)"/>
    </mask>
    <radialGradient id="lbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22E58B" stop-opacity="0.26"/>
      <stop offset="0.42" stop-color="#22E58B" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#22E58B" stop-opacity="0"/>
    </radialGradient>
    <!-- The left third carries the profile photo, so it is dropped to solid
         black. It also stops the grid competing with the avatar's edge. -->
    <linearGradient id="lbLeftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="1"/>
      <stop offset="0.16" stop-color="#000000" stop-opacity="0.94"/>
      <stop offset="0.32" stop-color="#000000" stop-opacity="0.62"/>
      <stop offset="0.46" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1584" height="396" fill="#020507"/>
  <rect width="1584" height="396" fill="url(#lbGrid)" mask="url(#lbGridMask)"/>
  <rect width="1584" height="396" fill="url(#lbLeftShade)"/>

  <!-- Left identity rail -->
  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" letter-spacing="3.4">
    <circle cx="52" cy="52" r="4.5" fill="#22E58B"/>
    <text x="68" y="57" fill="#91A6B7">AEGIS NEXUS &#183; SECURE PROFILE</text>
  </g>
  <path d="M52 78 V150" stroke="#1B405A" stroke-width="1.5"/>

  <!-- Globe -->
  <g transform="translate(1300 198)">
    <circle r="196" fill="url(#lbGlow)"/>
    <g fill="none" stroke="#1B405A">
      <circle r="148" stroke-opacity="0.9"/>
      <ellipse rx="99" ry="148" stroke-opacity="0.55"/>
      <ellipse rx="49" ry="148" stroke-opacity="0.55"/>
      <line x1="0" y1="-148" x2="0" y2="148" stroke-opacity="0.55"/>
      <path d="M-110 -99 Q0 -78 110 -99" stroke-opacity="0.55"/>
      <path d="M-140 -49 Q0 -25 140 -49" stroke-opacity="0.55"/>
      <path d="M-148 0 Q0 25 148 0" stroke-opacity="0.65"/>
      <path d="M-140 49 Q0 74 140 49" stroke-opacity="0.55"/>
      <path d="M-110 99 Q0 121 110 99" stroke-opacity="0.55"/>
    </g>

    <!-- Routes from the UK base node -->
    <g fill="none" stroke="#22E58B" stroke-opacity="0.5" stroke-width="1.4">
      <path d="M-20 -64 Q-80 -30 -97 21"/>
      <path d="M-20 -64 Q50 -26 81 23"/>
      <path d="M-20 -64 Q-4 11 -39 81"/>
      <path d="M-20 -64 Q74 -6 58 92"/>
      <path d="M-20 -64 Q-96 -70 -128 -22"/>
    </g>
    <g fill="#91A6B7">
      <circle cx="-97" cy="21" r="3.6"/><circle cx="81" cy="23" r="3.6"/>
      <circle cx="-39" cy="81" r="3.6"/><circle cx="58" cy="92" r="3.6"/>
      <circle cx="-128" cy="-22" r="3.2"/><circle cx="-55" cy="-35" r="3"/>
      <circle cx="42" cy="-78" r="3"/><circle cx="5" cy="117" r="3"/>
    </g>
    <circle cx="-20" cy="-64" r="13" fill="#22E58B" fill-opacity="0.22"/>
    <circle cx="-20" cy="-64" r="6.4" fill="#22E58B"/>

    <!-- Instrument frame -->
    <g fill="none" stroke="#22E58B" stroke-opacity="0.55" stroke-width="1.6">
      <path d="M-176 -140 V-176 H-140M176 -140 V-176 H140M-176 140 V176 H-140M176 140 V176 H140"/>
    </g>
  </g>

  <!-- Availability pill -->
  <rect x="430" y="86" width="452" height="36" rx="18" fill="#0C2B22" stroke="#22E58B" stroke-opacity="0.45" stroke-width="1.4"/>
  <circle cx="453" cy="104" r="5.5" fill="#22E58B"/>
  <text x="469" y="110" fill="#22E58B" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Open to cyber security opportunities worldwide</text>

  <!-- Name -->
  <text x="428" y="196" fill="#F5F8FA" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2.2">SARMAD <tspan fill="#22E58B">SAEED</tspan></text>

  <text x="430" y="234" fill="#F5F8FA" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="650">MSc Cyber Security Graduate</text>
  <text x="430" y="264" fill="#91A6B7" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">University of Chester &#183; Graduated &#183; Based in the United Kingdom</text>

  <!-- Focus tags -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="430" y="292" width="124" height="30" rx="8" fill="#081827" stroke="#1B405A"/>
    <text x="492" y="312" text-anchor="middle" fill="#C6D2DC">SOC OPERATIONS</text>
    <rect x="564" y="292" width="66" height="30" rx="8" fill="#081827" stroke="#1B405A"/>
    <text x="597" y="312" text-anchor="middle" fill="#C6D2DC">DFIR</text>
    <rect x="640" y="292" width="98" height="30" rx="8" fill="#081827" stroke="#1B405A"/>
    <text x="689" y="312" text-anchor="middle" fill="#C6D2DC">ICS / OT</text>
    <rect x="748" y="292" width="164" height="30" rx="8" fill="#081827" stroke="#1B405A"/>
    <text x="830" y="312" text-anchor="middle" fill="#C6D2DC">SECURITY RESEARCH</text>
  </g>

  <text x="430" y="352" fill="#91A6B7" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" letter-spacing="1.6">ghauriboy295.github.io</text>
</svg>
