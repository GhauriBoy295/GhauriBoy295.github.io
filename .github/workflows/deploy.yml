name: Deploy

# Where each host gets its copy of main:
#
#   GitHub Pages  Native. This repository is a <user>.github.io site published
#                 straight from the main branch, so Pages rebuilds on every
#                 push with no workflow at all. Adding an actions/deploy-pages
#                 job would conflict with that unless the Pages source were
#                 switched to "GitHub Actions" first, so it is left alone.
#
#   Vercel        Native. The repository is linked to the Vercel project
#                 "ghauri-boy295-github-io" with main as the production branch,
#                 so Vercel builds and promotes every push itself. Running the
#                 Vercel CLI here as well would deploy the same commit twice.
#
#   Netlify       This workflow. Netlify has no git link, so the site is
#                 published from CI.
#
# The Netlify job only runs once its secrets exist. It checks for them first
# and skips cleanly if they are absent, so this workflow is green from the
# moment it lands and starts deploying the minute the secrets are added.
# Nothing here ever prints a secret.
#
# Secrets to add under Settings → Secrets and variables → Actions:
#   NETLIFY_AUTH_TOKEN   app.netlify.com/user/applications#personal-access-tokens
#   NETLIFY_SITE_ID      Site configuration → Site information → Site ID

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  netlify:
    name: Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for credentials
        id: check
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$SITE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Netlify secrets are not set yet — skipping. See the header of this workflow."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '20'

      - name: Deploy to production
        if: steps.check.outputs.ready == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm install --global netlify-cli@latest
          netlify deploy --prod --dir=. --message="Deploy ${{ github.sha }}"
